<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>¿Qué haces por acá? 👀</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 30% 20%, #2b2b2b, #0e0e0e 70%);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    overflow: hidden;
    position: relative;
  }

  .card {
    position: relative;
    background: #ffffff;
    border: 3px solid #ff3b3b;
    border-radius: 40px 12px 40px 12px / 12px 40px 12px 40px;
    box-shadow: 0 0 0 6px rgba(255,59,59,0.12), 0 20px 50px rgba(0,0,0,0.5);
    padding: 50px 35px 40px;
    max-width: 380px;
    width: 90%;
    text-align: center;
    animation: pop 0.45s cubic-bezier(.34,1.56,.64,1);
  }

  @keyframes pop {
    0%   { transform: scale(0.7); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  .sticker-corner {
    position: absolute;
    top: -38px;
    right: -28px;
    width: 78px;
    height: 78px;
    transform: rotate(12deg);
    filter: drop-shadow(0 6px 10px rgba(0,0,0,0.35));
    pointer-events: none;
  }

  .sticker-side {
    position: absolute;
    bottom: -36px;
    left: -30px;
    width: 90px;
    filter: drop-shadow(0 6px 10px rgba(0,0,0,0.35));
    pointer-events: none;
  }

  h1 {
    font-size: 1.5rem;
    color: #1a1a1a;
    margin: 0 0 30px;
    line-height: 1.3;
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 14px;
    position: relative;
    min-height: 60px;
  }

  .options.row {
    flex-direction: row;
    justify-content: center;
    gap: 20px;
  }

  button {
    font-size: 1rem;
    font-family: inherit;
    padding: 12px 22px;
    border-radius: 20px 8px 20px 8px / 8px 20px 8px 20px;
    border: 2px solid #ff3b3b;
    background: #fff5f5;
    color: #1a1a1a;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.2s ease;
  }

  button:hover {
    background: #ffe0e0;
    transform: translateY(-2px) scale(1.04);
  }

  #btn-no {
    position: relative;
    transition: none;
  }

  #screen2 {
    display: none;
  }

  .hidden { display: none !important; }
</style>
</head>

    <h1>buenoo.. entonces ¿me escribes? :3 🧃</h1>
    <div class="options row" id="options2">
      <button id="btn-si" onclick="siClick()">si</button>
      <button id="btn-no">no</button>
    </div>
  </div>

<script>
  function goScreen2() {
    document.getElementById('screen1').style.display = 'none';
    document.getElementById('screen2').style.display = 'block';
    setupNoButton();
  }

  function siClick() {
    document.body.innerHTML = `
      <div class="card" style="animation:pop .4s;">
        <h1>Perfecto :3 ¡nos vemos por ahí! 🧃</h1>
      </div>`;
    setTimeout(() => {
      window.close();
      // Si el navegador no permite cerrar la pestaña (no fue abierta por script),
      // al menos dejamos el mensaje final visible.
    }, 600);
  }

  function setupNoButton() {
    const noBtn = document.getElementById('btn-no');
    const opts = document.getElementById('options2');

    function moveButton() {
      const maxX = window.innerWidth - noBtn.offsetWidth - 20;
      const maxY = window.innerHeight - noBtn.offsetHeight - 20;
      const x = Math.max(10, Math.random() * maxX);
      const y = Math.max(10, Math.random() * maxY);
      noBtn.style.position = 'fixed';
      noBtn.style.left = x + 'px';
      noBtn.style.top = y + 'px';
      noBtn.style.zIndex = 999;
    }

    // Cada vez que el mouse se acerca, huye
    noBtn.addEventListener('mouseenter', moveButton);
    noBtn.addEventListener('click', (e) => {
      e.preventDefault();
      moveButton();
    });
    // Version táctil (mobile): se mueve al tocar cerca
    document.addEventListener('touchmove', (e) => {
      const rect = noBtn.getBoundingClientRect();
      const touch = e.touches[0];
      const dist = Math.hypot(touch.clientX - (rect.left+rect.width/2), touch.clientY - (rect.top+rect.height/2));
      if (dist < 80) moveButton();
    });
  }
</script>
